name: Update activity graph

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/activity.py", ".github/workflows/activity.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download fonts (SIL Open Font License)
        run: |
          mkdir -p fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -sfL -o fonts/Rajdhani-Bold.ttf $base/rajdhani/Rajdhani-Bold.ttf
          curl -sfL -o fonts/Rajdhani-SemiBold.ttf $base/rajdhani/Rajdhani-SemiBold.ttf
          curl -sfL -o fonts/ShareTechMono-Regular.ttf $base/sharetechmono/ShareTechMono-Regular.ttf
      - run: pip install fonttools==4.53.1
      - run: python scripts/activity.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity.svg
          git diff --cached --quiet || git commit -m "Update activity graph"
          git push
